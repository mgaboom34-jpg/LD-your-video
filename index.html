<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>L&amp;D your video | תיק עבודות</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="L&D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;500;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080b;--card:#121218;--tx:#f5f5f7;--mu:#9a9aa8;--a:#22d3ee;--b:#a855f7;--c:#fb7185;--g:linear-gradient(120deg,var(--a),var(--b) 55%,var(--c));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,sans-serif;overflow-x:hidden;padding-bottom:20px}
.glow{position:fixed;inset:-20% -20% auto;height:70vh;background:radial-gradient(40% 50% at 30% 30%,#22d3ee33,transparent),radial-gradient(40% 50% at 75% 40%,#a855f733,transparent),radial-gradient(30% 40% at 55% 70%,#fb718522,transparent);filter:blur(30px);z-index:-1;animation:fl 12s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(-4%,6%) scale(1.15)}}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 24px}
.hero img{width:min(78vw,420px);filter:drop-shadow(0 0 40px #a855f766);animation:pop 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px);filter:blur(12px)}}
.hero h1{font-weight:900;font-size:clamp(26px,7vw,44px);margin-top:34px;line-height:1.2;animation:pop 1.4s .25s both}
.hero h1 span,.t span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);margin-top:14px;font-weight:300;font-size:17px;animation:pop 1.4s .45s both}
.btns{display:flex;gap:12px;margin-top:30px;animation:pop 1.4s .6s both}
.btn{border:0;border-radius:99px;padding:14px 26px;font:500 16px Heebo,sans-serif;color:#fff;text-decoration:none;cursor:pointer;background:var(--g);box-shadow:0 8px 30px #a855f755}
.btn.o{background:#ffffff14;box-shadow:none;border:1px solid #ffffff2a}
.arrow{margin-top:40px;color:var(--mu);font-size:13px;letter-spacing:2px;animation:bn 2s infinite}
@keyframes bn{50%{transform:translateY(8px)}}
section{padding:40px 20px;max-width:1100px;margin:auto}
.t{font-weight:900;font-size:clamp(28px,6vw,42px);margin-bottom:6px}
.sub{color:var(--mu);margin-bottom:22px}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid #ffffff22;background:#ffffff0d;color:var(--tx);border-radius:99px;padding:9px 18px;font:500 14px Heebo,sans-serif;cursor:pointer}
.chip.on{background:var(--g);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--card) center/cover;cursor:pointer;border:1px solid #ffffff12;transition:transform .4s}
.card:active{transform:scale(.97)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000d 5%,transparent 60%)}
.card .in2{position:absolute;inset:auto 18px 18px;z-index:2}
.card small{display:inline-block;background:#ffffff1f;backdrop-filter:blur(8px);border-radius:99px;padding:4px 12px;font-size:12px;margin-bottom:8px}
.card h3{font-size:21px;font-weight:800}
.rv{opacity:0;transform:translateY(40px) scale(.97);transition:all .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.empty{color:var(--mu);text-align:center;padding:40px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 20px 10px}
#lock{background:none;border:0;color:#ffffff33;font-size:16px;margin-top:8px;cursor:pointer}
.bar{position:fixed;inset:auto 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:20;max-width:520px;margin:auto}
.bar a{flex:1;text-align:center;padding:15px;border-radius:99px;color:#fff;text-decoration:none;font-weight:800;backdrop-filter:blur(16px)}
.bar .w{background:#16a34acc}.bar .p{background:#ffffff1f;border:1px solid #ffffff2a}
.sheet{position:fixed;inset:0;background:#000b;backdrop-filter:blur(10px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.pan{background:#14141b;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .4s}
@keyframes up{from{transform:translateY(100%)}}
.pan h2{font-weight:900;margin-bottom:14px}
.pan .cv{width:100%;aspect-ratio:16/10;border-radius:16px;background:#222 center/cover;margin-bottom:14px}
.pan p{color:#d0d0da;line-height:1.7;margin-bottom:16px;white-space:pre-wrap}
input,select,textarea{width:100%;background:#0d0d12;border:1px solid #ffffff22;color:var(--tx);border-radius:14px;padding:13px;font:16px Heebo,sans-serif;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff12}
.row span{flex:1}.row button{background:#fb718533;border:0;color:#fb7185;border-radius:10px;padding:6px 12px}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#fff;color:#000;padding:10px 18px;border-radius:99px;z-index:99;display:none}
.pl{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);z-index:2;width:64px;height:64px;border-radius:50%;background:#ffffff26;backdrop-filter:blur(8px);display:grid;place-items:center;font-style:normal;font-size:24px}

.card{background-position:center top}.pan iframe{display:block}
</style>
</head>
<body>
<div class="glow"></div>
<div id="app"></div>
<div class="sheet" id="view"><div class="pan" id="vp"></div></div>
<script>
const $=s=>document.querySelector(s),D={"p": [{"id": "tt1", "t": "רילס 1", "c": "רילס וסושיאל", "d": "עריכה וגרפיקה של L&D your video", "l": "https://www.tiktok.com/@ld.your.video/video/7693204004909763861"}, {"id": "tt2", "t": "רילס 2", "c": "רילס וסושיאל", "d": "עריכה וגרפיקה של L&D your video", "l": "https://www.tiktok.com/@ld.your.video/video/7685065398177320212"}, {"id": "tt3", "t": "רילס 3", "c": "רילס וסושיאל", "d": "עריכה וגרפיקה של L&D your video", "l": "https://www.tiktok.com/@ld.your.video/video/7679835252574965012"}, {"id": "tt4", "t": "רילס 4", "c": "רילס וסושיאל", "d": "עריכה וגרפיקה של L&D your video", "l": "https://www.tiktok.com/@ld.your.video/video/7680612548835790100"}, {"id": "tt5", "t": "רילס 5", "c": "רילס וסושיאל", "d": "עריכה וגרפיקה של L&D your video", "l": "https://www.tiktok.com/@ld.your.video/video/7681331057966566676"}]};
let cat='הכל';
const DRIVE='https://drive.google.com/drive/folders/13o16I06arWrH7O5ZYTw542CttlgWuPms?usp=sharing';
function tt(l){const m=l.match(/\/video\/(\d+)/);return m?'https://www.tiktok.com/embed/v2/'+m[1]:null}
function render(){
 const cats=['הכל',...new Set(D.p.map(x=>x.c))],list=D.p.filter(x=>cat=='הכל'||x.c==cat);
 $('#app').innerHTML=`<div class="hero"><img src="logo.webp" alt="L&D your video"><h1>הופכים רעיונות ל<span>וידאו וגרפיקה</span><br>שאי אפשר להתעלם מהם</h1><p>עריכת וידאו · גרפיקה · מיתוג · הכל במקום אחד</p><div class="btns"><a class="btn" href="#w">לעבודות שלי</a></div><div class="arrow">▼ גלול ▼</div></div>
 <section id="w"><div class="t rv">העבודות <span>שלי</span></div><div class="sub rv">${D.p.length} פרויקטים נבחרים</div>
 <div class="chips rv">${cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${c}"></button>`).join('')}</div>
 <div class="grid">${list.map(p=>`<div class="card rv" style="background-image:url(cover.jpg)"><i class="pl">▶</i><div class="in2"><small></small><h3></h3></div></div>`).join('')}</div>
 <div style="text-align:center;margin-top:28px"><a class="btn" target="_blank" rel="noopener" href="${DRIVE}">לכל העבודות בתיקיית הדרייב ↗</a></div></section>
 <footer>© L&amp;D your video</footer>`;
 document.querySelectorAll('.chip').forEach(b=>{b.textContent=b.dataset.c;b.onclick=()=>{cat=b.dataset.c;render()}});
 document.querySelectorAll('.card').forEach((c,k)=>{const p=list[k];c.querySelector('small').textContent=p.c;c.querySelector('h3').textContent=p.t;c.onclick=()=>open_(p)});
 const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});
 document.querySelectorAll('.rv').forEach(e=>io.observe(e));
}
function shut(){$('#view').classList.remove('open');$('#vp').innerHTML=''}
function open_(p){
 const v=$('#vp');v.innerHTML='<h2></h2><small style="color:var(--a)"></small><p></p><div class="btns" style="margin:0"></div>';
 const e=tt(p.l);
 if(e){const f=document.createElement('iframe');f.src=e;f.allow='autoplay;fullscreen;encrypted-media;picture-in-picture';f.allowFullscreen=true;f.style.cssText='width:100%;max-width:340px;margin:0 auto 14px;border:0;border-radius:16px;height:min(72vh,620px)';v.prepend(f)}
 v.querySelector('h2').textContent=p.t;v.querySelector('small').textContent=p.c;v.querySelector('p').textContent=p.d;
 const b=v.querySelector('.btns'),a=document.createElement('a');a.className='btn';a.href=p.l;a.target='_blank';a.rel='noopener';a.textContent='פתח בטיקטוק ↗';b.append(a);
 const x=document.createElement('button');x.className='btn o';x.textContent='סגור';x.onclick=shut;b.append(x);
 $('#view').classList.add('open');
}
$('#view').onclick=e=>{if(e.target.id=='view')shut()};
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
